###############################################################################
# SleekOS GRUB2 Configuration
# Modern boot menu with SleekOS branding
###############################################################################

# ─── General Settings ───────────────────────────────────────────────────────
set timeout=5
set default=0
set gfxmode=1920x1080,1280x720,auto
set gfxpayload=keep

# Load video modules
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg

# Set terminal to graphical
terminal_output gfxterm

# ─── Theme ──────────────────────────────────────────────────────────────────
set theme=/boot/grub/theme/theme.txt
export theme

# ─── Color Scheme (fallback if theme fails) ─────────────────────────────────
set color_normal=white/black
set color_highlight=cyan/black
set menu_color_normal=white/black
set menu_color_highlight=black/cyan

# ─── Boot Entries ───────────────────────────────────────────────────────────

menuentry "SleekOS - Start" --class sleekos --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live quiet splash loglevel=0 \
        systemd.show_status=false \
        vt.global_cursor_default=0 \
        udev.log_level=0
    initrd /live/initrd.img
}

menuentry "SleekOS - Safe Mode" --class sleekos-safe --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live quiet nomodeset \
        systemd.show_status=true
    initrd /live/initrd.img
}

menuentry "SleekOS - Debug Mode (Verbose)" --class sleekos-debug --class os {
    linux /live/vmlinuz boot=live \
        systemd.show_status=true
    initrd /live/initrd.img
}

menuentry "" --class spacer {
    true
}

menuentry "System Setup (UEFI Firmware)" --class firmware {
    fwsetup
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Shutdown" --class shutdown {
    halt
}
