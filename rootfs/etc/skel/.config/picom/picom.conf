# ═══════════════════════════════════════════════════════════════════════════
# SleekOS Picom Compositor Configuration
# Provides shadows, transparency, blur, rounded corners, and animations
# ═══════════════════════════════════════════════════════════════════════════

# ─── Backend ─────────────────────────────────────────────────────────────
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-copy-from-front = false;

# ─── Shadows ─────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'tint2'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'slop'"
];

# ─── Fading ──────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [];
no-fading-openclose = false;
no-fading-destroyed-argb = true;

# ─── Opacity ─────────────────────────────────────────────────────────────
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;
inactive-dim = 0.0;

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",
    "class_g = 'slop'"
];

opacity-rule = [
    "92:class_g = 'Sakura'",
    "95:class_g = 'Rofi'",
    "90:class_g = 'tint2'",
    "100:class_g = 'firefox-esr'",
    "100:class_g = 'Firefox-esr'",
    "100:class_g = 'vlc'",
    "100:fullscreen"
];

# ─── Rounded Corners ────────────────────────────────────────────────────
corner-radius = 12;

rounded-corners-exclude = [
    "class_g = 'tint2'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ─── Blur ────────────────────────────────────────────────────────────────
blur: {
    method = "dual_kawase";
    strength = 4;
    background = true;
    background-frame = false;
    background-fixed = false;
};

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ─── General ─────────────────────────────────────────────────────────────
daemon = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

# Window type rules
wintypes: {
    tooltip = {
        fade = true;
        shadow = true;
        opacity = 0.95;
        focus = true;
        full-shadow = false;
    };
    dock = {
        shadow = false;
        clip-shadow-above = true;
    };
    dnd = {
        shadow = false;
    };
    popup_menu = {
        opacity = 0.95;
        shadow = true;
    };
    dropdown_menu = {
        opacity = 0.95;
        shadow = true;
    };
    dialog = {
        shadow = true;
    };
};
